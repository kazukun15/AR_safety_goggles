name: Build SafeAR V18 All-in-One

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========================================================
      # 1. ソースコードをこの場で生成する (Generate Source Code)
      # ========================================================
      - name: Generate Project Files
        shell: bash
        run: |
          # ディレクトリ作成
          mkdir -p app/src/main/java/jp/kamijima/safear/v18
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

          # --- settings.gradle ---
          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SafeAR-V18"
          include ':app'
          EOF

          # --- build.gradle (Project) ---
          cat <<'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          # --- app/build.gradle (Module) ---
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'jp.kamijima.safear.v18'
              compileSdk 35
              defaultConfig {
                  applicationId "jp.kamijima.safear.v18"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "18.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.camera:camera-core:1.3.4'
              implementation 'androidx.camera:camera-camera2:1.3.4'
              implementation 'androidx.camera:camera-lifecycle:1.3.4'
              implementation 'androidx.camera:camera-view:1.3.4'
              implementation 'com.google.mlkit:object-detection:17.0.2'
          }
          EOF

          # --- AndroidManifest.xml ---
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="SafeAR Hyper"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # ========================================================
      # 2. ビルドツール (Gradle) を直接インストール
      # ========================================================
      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      # ========================================================
      # 3. ビルド実行 & アップロード
      # ========================================================
      - name: Build APK
        shell: bash
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeAR-V18-APK
          path: app/build/outputs/apk/debug/app-debug.apk
