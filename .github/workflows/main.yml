# --- OverlayView (Color Coded & Translucent) ---
create_file(f"{JAVA_DIR}/OverlayView.java", """
package jp.kamijima.safear.v18;
import android.content.Context;
import android.graphics.*;
import android.util.AttributeSet;
import android.view.View;
import java.util.*;

public class OverlayView extends View {
    public static class Tracked {
        public RectF box;
        public String label; 
        public boolean isApproaching;
        public int baseColor;
    }
    private final Paint pStroke = new Paint();
    private final Paint pFill = new Paint();
    private final Paint pText = new Paint();
    private final Path trianglePath = new Path();
    private List<Tracked> items = new ArrayList<>();
    
    public OverlayView(Context c, AttributeSet a) {
        super(c, a);
        pStroke.setStyle(Paint.Style.STROKE); pStroke.setStrokeWidth(6f); pStroke.setStrokeCap(Paint.Cap.ROUND); pStroke.setAntiAlias(true);
        pFill.setStyle(Paint.Style.FILL); pFill.setAntiAlias(true);
        pText.setColor(Color.WHITE); pText.setTypeface(Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)); pText.setTextSize(36f); pText.setShadowLayer(4f, 0f, 0f, Color.BLACK);
    }
    public void setItems(List<Tracked> list) { this.items = list; postInvalidate(); }
    
    @Override protected void onDraw(Canvas c) {
        super.onDraw(c);
        int w = getWidth(); int h = getHeight();
        if (w == 0 || h == 0 || items == null) return;

        for (Tracked t : items) {
            if (t.box == null) continue;
            int color = t.isApproaching ? Color.RED : t.baseColor;

            pFill.setColor(color); pFill.setAlpha(40); c.drawRect(t.box, pFill);
            pStroke.setColor(color); pStroke.setShadowLayer(10f, 0f, 0f, color); c.drawRect(t.box, pStroke);

            if (t.isApproaching) drawWarningSign(c, t.box.centerX(), t.box.top - 50);

            float labelY = t.box.top - 10; if (labelY < 50) labelY = t.box.bottom + 40;
            pFill.setAlpha(200);
            c.drawRect(t.box.left - 5, labelY - 35, t.box.left + pText.measureText(t.label) + 10, labelY + 10, pFill);
            c.drawText(t.label, t.box.left, labelY, pText);
        }
    }
    private void drawWarningSign(Canvas c, float cx, float cy) {
        float size = 80f; float half = size / 2f;
        trianglePath.reset(); trianglePath.moveTo(cx, cy - half); trianglePath.lineTo(cx + half, cy + half); trianglePath.lineTo(cx - half, cy + half); trianglePath.close();
        pFill.setColor(Color.YELLOW); pFill.setAlpha(255); c.drawPath(trianglePath, pFill);
        pStroke.setColor(Color.BLACK); pStroke.setStrokeWidth(4f); c.drawPath(trianglePath, pStroke);
        pText.setColor(Color.BLACK); pText.setTextSize(60f); float tw = pText.measureText("!"); c.drawText("!", cx - tw/2, cy + half - 10, pText);
        pText.setColor(Color.WHITE); pText.setTextSize(36f);
    }
}
""")

# --- MainActivity (High-Res Logic) ---
create_file(f"{JAVA_DIR}/MainActivity.java", """
package jp.kamijima.safear.v18;
import android.Manifest;
import android.content.pm.PackageManager;
import android.graphics.*;
import android.os.*;
import android.speech.tts.TextToSpeech;
import android.util.Log;
import android.util.Size;
import android.view.View;
import android.widget.*;
import androidx.annotation.NonNull;
import androidx.appcompat.app.AppCompatActivity;
import androidx.camera.core.*;
import androidx.camera.lifecycle.ProcessCameraProvider;
import androidx.camera.view.PreviewView;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.google.common.util.concurrent.ListenableFuture;
import com.google.mlkit.vision.common.InputImage;
import com.google.mlkit.vision.objects.*;
import com.google.mlkit.vision.objects.defaults.ObjectDetectorOptions;
import java.util.*;
import java.util.concurrent.*;

public class MainActivity extends AppCompatActivity implements TextToSpeech.OnInitListener {
    private PreviewView previewView;
    private OverlayView overlay;
    private ExecutorService cameraExecutor;
    private TextToSpeech tts;
    private ImageButton btnSettings, btnSwitchCam;
    private View panelSettings;
    private Button btnClose;
    private Switch swVoice, swFocus, swTorch;
    private boolean isVoiceOn = true;
    private long lastSpeakTime = 0;
    private Map<Integer, Long> lastTimeMap = new ConcurrentHashMap<>();
    private Map<Integer, Float> lastWidthMap = new ConcurrentHashMap<>();
    private Map<Integer, RectF> smoothedBoxes = new ConcurrentHashMap<>();
    private ProcessCameraProvider cameraProvider;
    private CameraSelector currentCameraSelector = CameraSelector.DEFAULT_BACK_CAMERA;
    private Camera camera;

    @Override protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState); setContentView(R.layout.activity_main);
        initUI(); cameraExecutor = Executors.newSingleThreadExecutor(); tts = new TextToSpeech(this, this);
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCamera();
        else ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 10);
    }
    private void initUI() {
        previewView = findViewById(R.id.previewView); overlay = findViewById(R.id.overlay);
        btnSettings = findViewById(R.id.btnSettings); btnSwitchCam = findViewById(R.id.btnSwitchCam);
        panelSettings = findViewById(R.id.panelSettings); btnClose = findViewById(R.id.btnClose);
        swVoice = findViewById(R.id.swVoice); swFocus = findViewById(R.id.swFocus); swTorch = findViewById(R.id.swTorch);
        btnSettings.setOnClickListener(v -> panelSettings.setVisibility(View.VISIBLE));
        btnClose.setOnClickListener(v -> panelSettings.setVisibility(View.GONE));
        btnSwitchCam.setOnClickListener(v -> switchCamera());
        swVoice.setOnCheckedChangeListener((v,c) -> isVoiceOn = c);
        swTorch.setOnCheckedChangeListener((v, isChecked) -> {
            if (camera != null && camera.getCameraInfo().hasFlashUnit()) camera.getCameraControl().enableTorch(isChecked);
            else v.setChecked(false);
        });
    }
    private void switchCamera() {
        if (cameraProvider == null) return;
        currentCameraSelector = (currentCameraSelector == CameraSelector.DEFAULT_BACK_CAMERA) ? CameraSelector.DEFAULT_FRONT_CAMERA : CameraSelector.DEFAULT_BACK_CAMERA;
        swTorch.setChecked(false); bindCameraUseCases();
    }
    @Override public void onInit(int status) { if (status == TextToSpeech.SUCCESS) tts.setLanguage(Locale.JAPAN); }
    private void speak(String text) {
        if(isVoiceOn && (System.currentTimeMillis() - lastSpeakTime > 3000)) {
            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "ID"); lastSpeakTime = System.currentTimeMillis();
        }
    }
    @Override public void onRequestPermissionsResult(int rc, String[] perms, int[] res) { if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) startCamera(); }
    private void startCamera() {
        ListenableFuture<ProcessCameraProvider> future = ProcessCameraProvider.getInstance(this);
        future.addListener(() -> { try { cameraProvider = future.get(); bindCameraUseCases(); } catch (Exception e) {} }, ContextCompat.getMainExecutor(this));
    }
    private void bindCameraUseCases() {
        if (cameraProvider == null) return;
        try {
            cameraProvider.unbindAll();
            Preview preview = new Preview.Builder().build(); preview.setSurfaceProvider(previewView.getSurfaceProvider());
            ImageAnalysis analysis = new ImageAnalysis.Builder().setTargetResolution(new Size(1280, 720)).setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST).build();
            ObjectDetector detector = ObjectDetection.getClient(new ObjectDetectorOptions.Builder().setDetectorMode(ObjectDetectorOptions.STREAM_MODE).enableMultipleObjects().enableClassification().build());
            analysis.setAnalyzer(cameraExecutor, proxy -> {
                try { InputImage img = InputImage.fromMediaImage(proxy.getImage(), proxy.getImageInfo().getRotationDegrees());
                    if (img != null) detector.process(img).addOnSuccessListener(objects -> drawObjects(objects, proxy)).addOnFailureListener(e -> proxy.close());
                    else proxy.close();
                } catch (Exception e) { proxy.close(); }
            });
            camera = cameraProvider.bindToLifecycle(this, currentCameraSelector, preview, analysis);
        } catch(Exception e) {}
    }
    private void drawObjects(List<DetectedObject> objects, ImageProxy proxy) {
        try {
            int vw = overlay.getWidth(); int vh = overlay.getHeight(); if (vw == 0) return;
            int rot = proxy.getImageInfo().getRotationDegrees();
            int iw = (rot == 90 || rot == 270) ? proxy.getHeight() : proxy.getWidth();
            int ih = (rot == 90 || rot == 270) ? proxy.getWidth() : proxy.getHeight();
            float sx = (float)vw / iw; float sy = (float)vh / ih;
            long now = System.currentTimeMillis();
            boolean alertNeeded = false; String alertWord = "";
            List<OverlayView.Tracked> list = new ArrayList<>(); Set<Integer> currentIds = new HashSet<>();

            for(DetectedObject obj : objects) {
                Integer id = obj.getTrackingId(); if (id == null) continue; currentIds.add(id);
                Rect r = obj.getBoundingBox(); RectF currentBox = new RectF(r.left*sx, r.top*sy, r.right*sx, r.bottom*sy);
                if (smoothedBoxes.containsKey(id)) {
                    RectF prev = smoothedBoxes.get(id); float alpha = 0.3f;
                    currentBox.left = prev.left + alpha*(currentBox.left-prev.left); currentBox.top = prev.top + alpha*(currentBox.top-prev.top);
                    currentBox.right = prev.right + alpha*(currentBox.right-prev.right); currentBox.bottom = prev.bottom + alpha*(currentBox.bottom-prev.bottom);
                }
                smoothedBoxes.put(id, currentBox);

                String label = "物体"; int color = Color.LTGRAY;
                for(DetectedObject.Label l : obj.getLabels()) {
                    String t = l.getText().toLowerCase();
                    if (t.contains("person")) { label="HUMAN"; color=Color.CYAN; }
                    else if (t.contains("car") || t.contains("bus")) { label="CAR"; color=Color.RED; }
                    else if (t.contains("bike")) { label="BIKE"; color=Color.GREEN; }
                }
                OverlayView.Tracked t = new OverlayView.Tracked(); t.box = currentBox; t.label = label; t.baseColor = color; t.isApproaching = false;

                if (lastTimeMap.containsKey(id)) {
                    float growth = t.box.width() / lastWidthMap.get(id);
                    if (growth > 1.02f) { t.isApproaching = true; alertNeeded = true; alertWord = label + "接近"; }
                }
                lastTimeMap.put(id, now); lastWidthMap.put(id, t.box.width());
                list.add(t);
            }
            smoothedBoxes.keySet().retainAll(currentIds);
            overlay.setItems(list);
            if (alertNeeded) speak(alertWord);
        } catch(Exception t) {} finally { proxy.close(); }
    }
    @Override protected void onDestroy() { if (tts != null) tts.shutdown(); super.onDestroy(); cameraExecutor.shutdown(); }
}
""")

